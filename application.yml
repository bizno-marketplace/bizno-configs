eureka:
  instance:
    prefer-ip-address: true

management:
  server:
    port: 9761

  endpoints:
    web:
      exposure:
        include: health,refresh,info,prometheus,gateway

  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

  tracing:
    sampling:
      probability: 1.0

  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:14318/v1/metrics}

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:14318/v1/traces}

outbox:
  poller:
    interval-ms: 5000