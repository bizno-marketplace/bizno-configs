eureka:
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, refresh, info, prometheus, gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
      
  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://tempo:4318/v1/traces

  logging:
    pattern:
      correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
    include:
      - application-name
      - traceId
      - spanId

outbox:
  poller:
    interval-ms: 5000